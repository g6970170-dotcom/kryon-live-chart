
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kryon — Live 15s Candlestick Chart</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {

    html, body {

      display: block;

      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>

  <!-- FIXED 56PX FLAT 2D TOP HEADER -->
  <header id="topHeader" title="Double-tap Kryon logo to reset to $0.0001000" class="flex items-center justify-between px-3.5">

        <!-- Flat 2D Inline SVG Fallback -->
        <div id="kryonFallbackLogo" style="display: none;" class="w-full h-full items-center justify-center bg-[#0ecb81]">
          <svg class="w-5 h-5 text-[#0b0e11]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L14.6 7.4L20.5 6.5L17.6 11.8L21.5 16.3L15.6 17.2L14.5 22.8L10.5 18.4L5.2 21.1L6.6 15.3L2.2 11.4L7.9 9.6L8.2 3.7L12 7.5Z" />
          </svg>
        </div>

      <div class="flex items-baseline gap-2 min-w-0">
        <span class="text-[16px] font-bold tracking-tight text-[#eaecef] truncate">Kryon</span>
        <span class="text-[12px] font-medium text-[#848e9c] shrink-0">15s</span>

    </div>

    <!-- Top-Right: Live 7-Decimal Price & Percentage Change -->
    <div class="flex flex-col items-end justify-center shrink-0">
      <div id="livePrice" class="tabular-price text-[16px] font-bold text-[#0ecb81] leading-tight">
        $0.0001000
      </div>
      <div id="priceChangeBadge" class="tabular-price text-[11px] font-semibold text-[#0ecb81] leading-tight mt-0.5">
        +0.00%

  </header>

  <!-- FIXED FULL-VIEWPORT FLAT 2D CHART WRAPPER -->
  <main id="chartWrapper">
    <canvas id="kryonChart" class="cursor-grab active:cursor-grabbing"></canvas>

    <!-- Flat 2D Bottom-Left Horizontal Zoom Buttons (- / +) -->
    <div class="absolute bottom-8 left-3 z-10 flex items-center gap-1 bg-[#161a1e] border border-[#1e2329] rounded p-1">
      <button id="zoomOutBtn" aria-label="Zoom Out" class="w-8 h-8 flex items-center justify-center rounded text-[#848e9c] hover:text-[#eaecef] hover:bg-[#1e2329] text-base font-bold">
        −
      </button>
      <button id="zoomInBtn" aria-label="Zoom In" class="w-8 h-8 flex items-center justify-center rounded text-[#848e9c] hover:text-[#eaecef] hover:bg-[#1e2329] text-base font-bold">
        +
      </button>
    </div>

    <!-- Flat 2D Return-to-Live Button (Shown when scrolled back into history) -->
    <button id="snapLiveBtn" class="hidden absolute bottom-8 right-[86px] z-10 items-center gap-1 px-3 py-1.5 rounded bg-[#161a1e] hover:bg-[#1e2329] text-[11px] font-semibold text-[#0ecb81] border border-[#1e2329]">
      <span>→ Live</span>
    </button>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    /**
     * ============================================================================
     * EDITABLE KRYON PRICE & SHARED GLOBAL EPOCH CONFIGURATION
     * Change STARTING_PRICE anytime or double-tap the Kryon logo to reset.
     * ============================================================================
     */
    const STARTING_PRICE = 0.0001;
    const DIP_TARGET_PRICE = 0.0000997;
    const PEAK_TARGET_PRICE = 0.0001037;
    const CANDLE_DURATION_MS = 15000;
    const SUB_TICKS_PER_CANDLE = 60; // 60 deterministic Brownian-bridge sub-ticks per 15s candle
    const MIN_HISTORY_CANDLES = 320; // Always keep >= 320 historical candles behind candle 0
    const MAX_RENDER_CANDLES = 720;  // Rolling window cap for smooth 60fps scrolling

    // Shared Global UTC Epoch & Deterministic Seed so any device sees the exact same live market
    const DEFAULT_EPOCH_MS = 1795071600000;
    const DEFAULT_SESSION_SEED = 0x4b52594e;

    // Flat 2D Palette & Layout Constants
    const COLOR_BG = '#0b0e11';
    const COLOR_SURFACE = '#161a1e';
    const COLOR_BORDER = '#1e2329';
    const COLOR_BULL = '#0ecb81';
    const COLOR_BEAR = '#f6465d';
    const COLOR_TEXT_PRIMARY = '#eaecef';
    const COLOR_TEXT_SECONDARY = '#848e9c';
    const Y_AXIS_WIDTH = 78;
    const X_AXIS_HEIGHT = 26;
    const LIVE_ANCHOR_RATIO = 0.62; // Active candle anchored at ~62% X (center, slightly right)

    // Horizontal & Vertical Scaling Bounds
    const DEFAULT_CANDLE_SPACING = 14;
    const MIN_CANDLE_SPACING = 6;
    const MAX_CANDLE_SPACING = 26;
    const DEFAULT_VERTICAL_SCALE = 1.0;
    const MIN_VERTICAL_SCALE = 0.55;
    const MAX_VERTICAL_SCALE = 1.85;
    const VERTICAL_MARGIN_RATIO = 0.25;

    /**
     * ============================================================================
     * CONTINUOUS CLOCK-DRIVEN O(1) DETERMINISTIC MARKET ENGINE
     * Computes every 15s candle boundary and 60-step Brownian-bridge sub-tick path
     * purely from `Math.floor((Date.now() - epochStart) / 15000)` so the chart keeps
     * moving identically across all phones even when zero users have the app open.
     * ============================================================================
     */
    function hash2(seed, index) {
      let h = (seed ^ Math.imul(index | 0, 0x9e3779b9)) >>> 0;
      h = Math.imul(h ^ (h >>> 16), 0x85ebca6b) >>> 0;
      h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35) >>> 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }

    function hashRange(seed, index, min, max) {
      return min + hash2(seed, index) * (max - min);
    }

    // Approximate standard normal sample using Irwin-Hall sum of 6 uniform hashes
    function hashNormal(seed, index) {
      let sum = 0;
      for (let i = 0; i < 6; i++) {
        sum += hash2(seed, Math.imul(index, 7) + i);
      }
      return (sum - 3.0) * 1.41421356;
    }

    // Shared Synchronized Timeline State (Boots immediately at 0ms from DEFAULT_EPOCH_MS)
    let sessionState = {
      epochStart: DEFAULT_EPOCH_MS,
      sessionSeed: DEFAULT_SESSION_SEED
    };

    // Memoized Completed Candle Cache (Keyed by epochStart + sessionSeed)
    let cachedSessionKey = '';
    const completedCandleCache = new Map();

    function getSessionKey() {
      return `${sessionState.epochStart}_${sessionState.sessionSeed}`;
    }

    function resetCandleCacheIfNeeded() {
      const key = getSessionKey();
      if (key !== cachedSessionKey) {
        cachedSessionKey = key;
        completedCandleCache.clear();
      }
    }

    /**
     * O(1) Closed-Form Boundary Price `getBoundaryPrice(candleIndex)`:
     * - `candleIndex === 0`: Exact `STARTING_PRICE` (`0.0001000`).
     * - `candleIndex < 0`: Smooth deterministic historical waves arriving at `0.0001000`.
     * - `0 < candleIndex <= dipLen`: Low-volatility dip with organic bounces to `0.0000997`.
     * - `dipLen < candleIndex <= dipLen + rallyLen`: Realistic climb with red pullbacks to `0.0001037`.
     * - `candleIndex > dipLen + rallyLen`: Indefinite low-volatility market waves & consolidations.
     */
    function getBoundaryPrice(candleIndex) {
      if (candleIndex === 0) {
        return STARTING_PRICE;
      }

      const seed = sessionState.sessionSeed;
      const dipLen = 12;   // 12 candles (3m 00s) dip from 0.0001000 -> 0.0000997
      const rallyLen = 44; // 44 candles (11m 00s) rally from 0.0000997 -> 0.0001037
      const rallyEnd = dipLen + rallyLen;

      // 1. Historical Regime (candleIndex < 0)
      if (candleIndex < 0) {
        const m = -candleIndex;
        const p1 = hashRange(seed, 11, 0, Math.PI * 2);
        const p2 = hashRange(seed, 12, 0, Math.PI * 2);
        const p3 = hashRange(seed, 13, 0, Math.PI * 2);

        const slowWave = (Math.sin(m * 0.055 + p1) - Math.sin(p1)) * 0.00000065;
        const medWave = (Math.sin(m * 0.19 + p2) - Math.sin(p2)) * 0.00000028;
        const fineWave = (Math.sin(m * 0.61 + p3) - Math.sin(p3)) * 0.00000012;
        const microNoise = hashRange(seed, candleIndex * 17 + 3, -0.00000015, 0.00000015);

        return Math.max(0.00005, STARTING_PRICE + slowWave + medWave + fineWave + microNoise);
      }

      // 2. Dip Regime (0 < candleIndex <= dipLen)
      if (candleIndex <= dipLen) {
        if (candleIndex === dipLen) return DIP_TARGET_PRICE;
        const u = candleIndex / dipLen;
        const base = STARTING_PRICE + (DIP_TARGET_PRICE - STARTING_PRICE) * u;
        const ripple = Math.sin(u * Math.PI * 3) * 0.00000006;
        const noise = hashRange(seed, candleIndex * 23 + 5, -0.00000005, 0.00000005);
        return Math.max(0.00005, base + ripple + noise);
      }

      // 3. Rally Regime (dipLen < candleIndex <= rallyEnd)
      if (candleIndex <= rallyEnd) {
        if (candleIndex === rallyEnd) return PEAK_TARGET_PRICE;
        const v = (candleIndex - dipLen) / rallyLen;
        const base = DIP_TARGET_PRICE + (PEAK_TARGET_PRICE - DIP_TARGET_PRICE) * v;
        // Harmonics + noise produce realistic small red pullback candles during the climb
        const pullbackWave =
          Math.sin(v * Math.PI * 7) * 0.00000024 +
          Math.sin(v * Math.PI * 15) * 0.00000011;
        const candleNoise = hashRange(seed, candleIndex * 23 + 7, -0.00000014, 0.00000014);
        return Math.max(0.00005, base + pullbackWave + candleNoise);
      }

      // 4. Indefinite Continuous Market Waves Regime (candleIndex > rallyEnd)
      const t = candleIndex - rallyEnd;
      const s1 = hashRange(seed, 31, 0, Math.PI * 2);
      const s2 = hashRange(seed, 32, 0, Math.PI * 2);
      const s3 = hashRange(seed, 33, 0, Math.PI * 2);

      const consolidationCenter = (1 - Math.exp(-t * 0.03)) * 0.00000045;
      const w1 = (Math.sin(t * 0.042 + s1) - Math.sin(s1)) * 0.00000075;
      const w2 = (Math.sin(t * 0.145 + s2) - Math.sin(s2)) * 0.00000032;
      const w3 = (Math.sin(t * 0.48 + s3) - Math.sin(s3)) * 0.00000014;
      const stepJitter = hashRange(seed, candleIndex * 29 + 11, -0.00000016, 0.00000016);

      return Math.max(0.00005, PEAK_TARGET_PRICE + consolidationCenter + w1 + w2 + w3 + stepJitter);
    }

    /**
     * Builds the 60-step deterministic Brownian bridge connecting `open = getBoundaryPrice(k)`
     * to `close = getBoundaryPrice(k + 1)` inside `[0, 15000ms]`.
     */
    function buildBrownianBridge(candleIndex) {
      const seed = sessionState.sessionSeed;
      const open = getBoundaryPrice(candleIndex);
      const close = getBoundaryPrice(candleIndex + 1);
      const steps = SUB_TICKS_PER_CANDLE;

      const bodyRange = Math.abs(close - open);
      const sigma = Math.max(bodyRange * 0.13, 0.000000024);

      const walk = new Array(steps + 1);
      walk[0] = 0;
      for (let s = 1; s <= steps; s++) {
        const dW = hashNormal(seed, Math.imul(candleIndex, 97) + s) * sigma;
        walk[s] = walk[s - 1] + dW;
      }

      const totalWalk = walk[steps];
      const bridgePrices = new Array(steps + 1);
      bridgePrices[0] = open;
      bridgePrices[steps] = close;

      let high = Math.max(open, close);
      let low = Math.min(open, close);

      for (let s = 1; s < steps; s++) {
        const frac = s / steps;
        const bridgeOffset = walk[s] - frac * totalWalk;
        const p = Math.max(0.00005, open + (close - open) * frac + bridgeOffset);
        bridgePrices[s] = p;
        if (p > high) high = p;
        if (p < low) low = p;
      }

      return {
        index: candleIndex,
        openTime: sessionState.epochStart + candleIndex * CANDLE_DURATION_MS,
        open,
        high,
        low,
        close,
        bridgePrices
      };
    }

    /**
     * Returns memoized completed OHLC candle for `candleIndex < currentCandleIndex`.
     */
    function getCompletedCandle(candleIndex) {
      if (completedCandleCache.has(candleIndex)) {
        return completedCandleCache.get(candleIndex);
      }
      const detail = buildBrownianBridge(candleIndex);
      const ohlc = {
        index: detail.index,
        openTime: detail.openTime,
        open: detail.open,
        high: detail.high,
        low: detail.low,
        close: detail.close
      };
      if (completedCandleCache.size > 1500) {
        const oldestKey = completedCandleCache.keys().next().value;
        completedCandleCache.delete(oldestKey);
      }
      completedCandleCache.set(candleIndex, ohlc);
      return ohlc;
    }

    /**
     * Evaluates the active live candle at exact `nowMs` across its 60 Brownian-bridge sub-ticks.
     */
    function evaluateActiveCandle(nowMs, currentIndex) {
      const detail = buildBrownianBridge(currentIndex);
      const elapsedMs = Math.max(0, nowMs - detail.openTime);
      const progress = Math.max(0, Math.min(0.9999, elapsedMs / CANDLE_DURATION_MS));
      const tickIdx = Math.min(SUB_TICKS_PER_CANDLE - 1, Math.floor(progress * SUB_TICKS_PER_CANDLE));

      let liveHigh = detail.open;
      let liveLow = detail.open;
      for (let s = 1; s <= tickIdx; s++) {
        const p = detail.bridgePrices[s];
        if (p > liveHigh) liveHigh = p;
        if (p < liveLow) liveLow = p;
      }
      const liveClose = detail.bridgePrices[tickIdx];

      return {
        index: detail.index,
        openTime: detail.openTime,
        open: detail.open,
        high: liveHigh,
        low: liveLow,
        close: liveClose
      };
    }

    /**
     * Returns the full timeline array of candles up to `currentIndex` at `nowMs`.
     */
    function getTimelineCandles(nowMs) {
      resetCandleCacheIfNeeded();
      const currentIndex = Math.floor((nowMs - sessionState.epochStart) / CANDLE_DURATION_MS);
      const startIndex = Math.min(-MIN_HISTORY_CANDLES, currentIndex - MAX_RENDER_CANDLES);

      const list = [];
      for (let idx = startIndex; idx < currentIndex; idx++) {
        list.push(getCompletedCandle(idx));
      }
      list.push(evaluateActiveCandle(nowMs, currentIndex));
      return list;
    }

    /**
     * ============================================================================
     * FIREBASE FIRESTORE MULTI-DEVICE SYNC & PERSISTENCE
     * Persists `{ epochStart, sessionSeed }` in `kryon_chart_state/global` under
     * `/artifacts/{appId}/public/data/kryon_chart_state/global`.
     * ============================================================================
     */
    let stateDocRef = null;
    let currentUser = null;

    async function persistSessionToCloud(newState) {
      if (!stateDocRef || !currentUser) return;
      try {
        await setDoc(stateDocRef, {
          epochStart: newState.epochStart,
          sessionSeed: newState.sessionSeed,
          updatedAt: Date.now()
        });
      } catch (err) {
        console.warn('Cloud state write skipped:', err);
      }
    }

    async function initCloudSync() {
      try {
        if (typeof __firebase_config === 'undefined' || !__firebase_config) return;
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Authenticate FIRST before any Firestore operations
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }

        if (!currentUser) return;

        stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'kryon_chart_state', 'global');

        const existingSnap = await getDoc(stateDocRef);
        if (existingSnap.exists()) {
          const data = existingSnap.data();
          if (typeof data.epochStart === 'number' && typeof data.sessionSeed === 'number') {
            sessionState = { epochStart: data.epochStart, sessionSeed: data.sessionSeed };
            resetCandleCacheIfNeeded();
            snapToLiveCamera();
          }
        } else {
          await persistSessionToCloud(sessionState);
        }

        // Real-time listener so all connected devices stay synchronized
        onSnapshot(
          stateDocRef,
          (snap) => {
            if (!snap.exists()) return;
            const data = snap.data();
            if (
              typeof data.epochStart === 'number' &&
              typeof data.sessionSeed === 'number' &&
              (data.epochStart !== sessionState.epochStart || data.sessionSeed !== sessionState.sessionSeed)
            ) {
              sessionState = { epochStart: data.epochStart, sessionSeed: data.sessionSeed };
              resetCandleCacheIfNeeded();
              snapToLiveCamera();
            }
          },
          (error) => {
            console.warn('Firestore snapshot listener warning:', error);
          }
        );
      } catch (err) {
        console.warn('Running with global UTC epoch sync:', err);
      }
    }

    /**
     * ============================================================================
     * CANVAS & INTERACTION ENGINE
     * ============================================================================
     */
    const chartWrapper = document.getElementById('chartWrapper');
    const canvas = document.getElementById('kryonChart');
    const ctx = canvas.getContext('2d');
    const livePriceEl = document.getElementById('livePrice');
    const priceChangeBadgeEl = document.getElementById('priceChangeBadge');
    const snapLiveBtn = document.getElementById('snapLiveBtn');
    const brandResetArea = document.getElementById('brandResetArea');

    let candles = [];
    let candleSpacing = DEFAULT_CANDLE_SPACING;
    let verticalScale = DEFAULT_VERTICAL_SCALE;
    let rightEdgeIndex = 0;
    let isLive = true;
    let isSnappingToLive = false;

    // Gesture & Pointer State
    let isDraggingPan = false;
    let isDraggingYAxis = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartRightEdge = 0;
    let dragStartVerticalScale = 1.0;
    let initialPinchDistance = null;
    let initialPinchSpacing = DEFAULT_CANDLE_SPACING;
    let hoverCrosshair = null;
    let lastBrandTapTime = 0;
    let lastYAxisTapTime = 0;

    function formatPrice(value) {
      return value.toFixed(7);
    }

    function formatTimestamp(ms) {
      const d = new Date(ms);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    }

    /**
     * Safely computes container dimensions so canvas NEVER collapses to 0x0.
     */
    function getSafeDimensions() {
      const rect = chartWrapper.getBoundingClientRect();
      const width = Math.max(rect.width, window.innerWidth, 320);
      const height = Math.max(rect.height, window.innerHeight - 56, 280);
      const plotWidth = Math.max(80, width - Y_AXIS_WIDTH);
      const plotHeight = Math.max(80, height - X_AXIS_HEIGHT);
      return { width, height, plotWidth, plotHeight };
    }

    function getLiveAnchoredRightEdge(plotWidth, totalCandles) {
      const lastIndex = Math.max(0, totalCandles - 1);
      const visibleSlots = plotWidth / candleSpacing;
      return (lastIndex + 0.5) + (1 - LIVE_ANCHOR_RATIO) * visibleSlots;
    }

    function snapToLiveCamera() {
      const { plotWidth } = getSafeDimensions();
      candles = getTimelineCandles(Date.now());
      rightEdgeIndex = getLiveAnchoredRightEdge(plotWidth, candles.length);
      isLive = true;
      isSnappingToLive = false;
      syncSnapButton();
    }

    function clampHorizontalBounds(plotWidth, totalCandles) {
      const visibleSlots = plotWidth / candleSpacing;
      const maxRightEdge = getLiveAnchoredRightEdge(plotWidth, totalCandles);
      const minRightEdge = Math.min(maxRightEdge, visibleSlots);

      rightEdgeIndex = Math.max(minRightEdge, Math.min(maxRightEdge, rightEdgeIndex));

      if (Math.abs(rightEdgeIndex - maxRightEdge) < 0.08) {
        rightEdgeIndex = maxRightEdge;
        isLive = true;
        isSnappingToLive = false;
      }
      syncSnapButton();
    }

    function syncSnapButton() {
      if (isLive) {
        snapLiveBtn.classList.add('hidden');
        snapLiveBtn.classList.remove('flex');
      } else {
        snapLiveBtn.classList.remove('hidden');
        snapLiveBtn.classList.add('flex');
      }
    }

    function drawRoundedRect(context, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      context.beginPath();
      context.moveTo(x + radius, y);
      context.lineTo(x + w - radius, y);
      context.quadraticCurveTo(x + w, y, x + w, y + radius);
      context.lineTo(x + w, y + h - radius);
      context.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      context.lineTo(x + radius, y + h);
      context.quadraticCurveTo(x, y + h, x, y + h - radius);
      context.lineTo(x, y + radius);
      context.quadraticCurveTo(x, y, x + radius, y);
      context.closePath();
    }

    function updateHeaderUI(activeCandle) {
      const price = activeCandle.close;
      const isBull = activeCandle.close >= activeCandle.open;
      livePriceEl.textContent = `$${formatPrice(price)}`;
      livePriceEl.style.color = isBull ? COLOR_BULL : COLOR_BEAR;

      const pct = ((price - STARTING_PRICE) / STARTING_PRICE) * 100;
      const sign = pct >= 0 ? '+' : '';
      priceChangeBadgeEl.textContent = `${sign}${pct.toFixed(2)}%`;
      priceChangeBadgeEl.style.color = pct >= -0.0001 ? COLOR_BULL : COLOR_BEAR;
    }

    /**
     * Main 60fps Flat 2D Render Loop
     */
    function renderLoop() {
      const nowMs = Date.now();
      const { width, height, plotWidth, plotHeight } = getSafeDimensions();
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const targetW = Math.floor(width * dpr);
      const targetH = Math.floor(height * dpr);

      if (canvas.width !== targetW || canvas.height !== targetH) {
        canvas.width = targetW;
        canvas.height = targetH;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      candles = getTimelineCandles(nowMs);
      const activeCandle = candles[candles.length - 1];
      updateHeaderUI(activeCandle);

      // Update camera position
      const targetLiveRightEdge = getLiveAnchoredRightEdge(plotWidth, candles.length);
      if (isSnappingToLive) {
        const diff = targetLiveRightEdge - rightEdgeIndex;
        if (Math.abs(diff) < 0.05) {
          rightEdgeIndex = targetLiveRightEdge;
          isSnappingToLive = false;
          isLive = true;
          syncSnapButton();
        } else {
          rightEdgeIndex += diff * 0.24;
        }
      } else if (isLive) {
        rightEdgeIndex = targetLiveRightEdge;
      } else {
        clampHorizontalBounds(plotWidth, candles.length);
      }

      // Clear full background (#0b0e11)
      ctx.fillStyle = COLOR_BG;
      ctx.fillRect(0, 0, width, height);

      // Visible horizontal index range
      const visibleSlots = plotWidth / candleSpacing;
      const leftEdgeIndex = rightEdgeIndex - visibleSlots;
      const firstVisibleIdx = Math.max(0, Math.floor(leftEdgeIndex) - 1);
      const lastVisibleIdx = Math.min(candles.length - 1, Math.ceil(rightEdgeIndex) + 1);

      const indexToCenterX = (idx) => (idx + 0.5 - leftEdgeIndex) * candleSpacing;

      // Compute visible Y price range
      let visibleMin = Infinity;
      let visibleMax = -Infinity;
      for (let i = firstVisibleIdx; i <= lastVisibleIdx; i++) {
        const c = candles[i];
        if (c.low < visibleMin) visibleMin = c.low;
        if (c.high > visibleMax) visibleMax = c.high;
      }

      if (!isFinite(visibleMin) || !isFinite(visibleMax)) {
        visibleMin = activeCandle.close - 0.0000003;
        visibleMax = activeCandle.close + 0.0000003;
      }

      const rawRange = Math.max(visibleMax - visibleMin, 0.0000005);
      const midPrice = (visibleMax + visibleMin) / 2;
      const paddedRange = (rawRange * (1 + VERTICAL_MARGIN_RATIO * 2)) / verticalScale;
      const yMin = midPrice - paddedRange / 2;
      const yMax = midPrice + paddedRange / 2;
      const ySpan = yMax - yMin;

      const priceToY = (p) => (1 - (p - yMin) / ySpan) * plotHeight;

      // Highlight right Y-axis column when dragging vertically
      if (isDraggingYAxis) {
        ctx.fillStyle = COLOR_SURFACE;
        ctx.fillRect(plotWidth, 0, Y_AXIS_WIDTH, plotHeight);
      }

      // 1. Flat 1px Horizontal Gridlines (#161a1e) & Right Y-Axis Price Labels
      const gridRows = 5;
      ctx.font = '500 10px "JetBrains Mono", monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      for (let i = 0; i <= gridRows; i++) {
        const ratio = i / gridRows;
        const y = ratio * plotHeight;
        const levelPrice = yMax - ratio * ySpan;

        if (i > 0 && i < gridRows) {
          ctx.beginPath();
          ctx.strokeStyle = COLOR_SURFACE;
          ctx.lineWidth = 1;
          ctx.moveTo(0, y);
          ctx.lineTo(plotWidth, y);
          ctx.stroke();
        }

        ctx.fillStyle = isDraggingYAxis ? COLOR_TEXT_PRIMARY : COLOR_TEXT_SECONDARY;
        ctx.fillText(formatPrice(levelPrice), plotWidth + 6, Math.max(10, Math.min(plotHeight - 10, y)));
      }

      // Axis Separator Lines
      ctx.beginPath();
      ctx.strokeStyle = COLOR_BORDER;
      ctx.lineWidth = 1;
      ctx.moveTo(plotWidth, 0);
      ctx.lineTo(plotWidth, height);
      ctx.moveTo(0, plotHeight);
      ctx.lineTo(width, plotHeight);
      ctx.stroke();

      // 2. Vertical Gridlines & Bottom X-Axis Timestamps (HH:MM:SS)
      const minLabelGapPx = 74;
      const labelStepCandles = Math.max(1, Math.ceil(minLabelGapPx / candleSpacing));

      ctx.font = '500 10px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = firstVisibleIdx; i <= lastVisibleIdx; i++) {
        const c = candles[i];
        if (Math.abs(c.index) % labelStepCandles === 0) {
          const x = indexToCenterX(i);
          if (x >= 26 && x <= plotWidth - 26) {
            ctx.beginPath();
            ctx.strokeStyle = COLOR_SURFACE;
            ctx.lineWidth = 1;
            ctx.moveTo(x, 0);
            ctx.lineTo(x, plotHeight);
            ctx.stroke();

            ctx.fillStyle = COLOR_TEXT_SECONDARY;
            ctx.fillText(formatTimestamp(c.openTime), x, plotHeight + X_AXIS_HEIGHT / 2);
          }
        }
      }

      // 3. Flat 2D Candlesticks (Clipped strictly to plot region)
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, plotWidth, plotHeight);
      ctx.clip();

      const bodyWidth = Math.max(3, Math.round(candleSpacing * 0.64));

      for (let i = firstVisibleIdx; i <= lastVisibleIdx; i++) {
        const c = candles[i];
        const cx = indexToCenterX(i);
        const isBull = c.close >= c.open;
        const color = isBull ? COLOR_BULL : COLOR_BEAR;

        const yHigh = priceToY(c.high);
        const yLow = priceToY(c.low);
        const yOpen = priceToY(c.open);
        const yClose = priceToY(c.close);

        // Crisp 1px High-Low Wick
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.moveTo(Math.round(cx) + 0.5, yHigh);
        ctx.lineTo(Math.round(cx) + 0.5, yLow);
        ctx.stroke();

        // Flat Open-Close Body
        const bodyTop = Math.min(yOpen, yClose);
        const bodyHeight = Math.max(2, Math.abs(yClose - yOpen));
        const bodyLeft = Math.round(cx - bodyWidth / 2);

        ctx.fillStyle = color;
        ctx.fillRect(bodyLeft, bodyTop, bodyWidth, bodyHeight);
      }

      ctx.restore();

      // 4. Dashed Horizontal Price Line & Solid Flat Price + Countdown Tag
      const isLiveBull = activeCandle.close >= activeCandle.open;
      const liveBadgeColor = isLiveBull ? COLOR_BULL : COLOR_BEAR;

      const rawLiveY = priceToY(activeCandle.close);
      const clampedLiveY = Math.max(18, Math.min(plotHeight - 18, rawLiveY));

      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = liveBadgeColor;
      ctx.lineWidth = 1;
      ctx.moveTo(0, clampedLiveY);
      ctx.lineTo(plotWidth, clampedLiveY);
      ctx.stroke();
      ctx.restore();

      const elapsedMs = Math.max(0, nowMs - activeCandle.openTime);
      const remainingSec = Math.max(0, Math.min(14, Math.floor((CANDLE_DURATION_MS - elapsedMs) / 1000)));
      const countdownStr = `00:${String(remainingSec).padStart(2, '0')}`;

      const badgeX = plotWidth + 3;
      const badgeW = Y_AXIS_WIDTH - 6;
      const badgeH = 32;
      const badgeY = clampedLiveY - badgeH / 2;

      ctx.fillStyle = liveBadgeColor;
      drawRoundedRect(ctx, badgeX, badgeY, badgeW, badgeH, 3);
      ctx.fill();

      ctx.fillStyle = COLOR_BG;
      ctx.font = '700 10px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(formatPrice(activeCandle.close), badgeX + badgeW / 2, badgeY + 10);

      ctx.font = '600 9.5px "JetBrains Mono", monospace';
      ctx.fillText(countdownStr, badgeX + badgeW / 2, badgeY + 22.5);

      // 5. Flat Crosshair & OHLC Readout on Pointer Hover / Touch Hold
      if (hoverCrosshair && !isDraggingPan && !isDraggingYAxis) {
        const { x, y } = hoverCrosshair;
        if (x >= 0 && x < plotWidth && y >= 0 && y < plotHeight) {
          const hoveredIdx = Math.floor(leftEdgeIndex + x / candleSpacing);
          if (hoveredIdx >= 0 && hoveredIdx < candles.length) {
            const c = candles[hoveredIdx];
            const snapX = indexToCenterX(hoveredIdx);

            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([3, 3]);
            ctx.strokeStyle = COLOR_TEXT_SECONDARY;
            ctx.lineWidth = 1;
            ctx.moveTo(snapX, 0);
            ctx.lineTo(snapX, plotHeight);
            ctx.moveTo(0, y);
            ctx.lineTo(plotWidth, y);
            ctx.stroke();
            ctx.restore();

            ctx.font = '500 10px "JetBrains Mono", monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillStyle = COLOR_TEXT_SECONDARY;
            ctx.fillText(
              `O ${formatPrice(c.open)}  H ${formatPrice(c.high)}  L ${formatPrice(c.low)}  C ${formatPrice(c.close)}`,
              10,
              8
            );
          }
        }
      }

      requestAnimationFrame(renderLoop);
    }

    /**
     * ============================================================================
     * INTERACTIVE ZOOM, PAN & Y-AXIS VERTICAL SCALING CONTROLS
     * ============================================================================
     */
    function applyHorizontalZoom(targetSpacing, anchorClientX = null) {
      const { plotWidth } = getSafeDimensions();
      const dynamicMinSpacing = Math.max(MIN_CANDLE_SPACING, plotWidth / Math.max(1, candles.length - 2));
      const clampedSpacing = Math.max(dynamicMinSpacing, Math.min(MAX_CANDLE_SPACING, targetSpacing));
      if (clampedSpacing === candleSpacing) return;

      if (isLive) {
        candleSpacing = clampedSpacing;
        rightEdgeIndex = getLiveAnchoredRightEdge(plotWidth, candles.length);
      } else {
        const rect = canvas.getBoundingClientRect();
        const localX = anchorClientX !== null ? (anchorClientX - rect.left) : (plotWidth * 0.5);
        const clampedX = Math.max(0, Math.min(plotWidth, localX));
        const slotsFromRight = (plotWidth - clampedX) / candleSpacing;
        const anchorIndex = rightEdgeIndex - slotsFromRight;

        candleSpacing = clampedSpacing;
        const newSlotsFromRight = (plotWidth - clampedX) / candleSpacing;
        rightEdgeIndex = anchorIndex + newSlotsFromRight;
        clampHorizontalBounds(plotWidth, candles.length);
      }
    }

    function isOverYAxisColumn(clientX) {
      const rect = canvas.getBoundingClientRect();
      const { plotWidth } = getSafeDimensions();
      return (clientX - rect.left) >= plotWidth;
    }

    // Mouse Controls
    canvas.addEventListener('mousedown', (e) => {
      if (isOverYAxisColumn(e.clientX)) {
        isDraggingYAxis = true;
        dragStartY = e.clientY;
        dragStartVerticalScale = verticalScale;
      } else {
        isDraggingPan = true;
        isSnappingToLive = false;
        dragStartX = e.clientX;
        dragStartRightEdge = rightEdgeIndex;
      }
    });

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      hoverCrosshair = { x: e.clientX - rect.left, y: e.clientY - rect.top };

      if (!isDraggingPan && !isDraggingYAxis) {
        canvas.style.cursor = isOverYAxisColumn(e.clientX) ? 'ns-resize' : 'grab';
      }

      if (isDraggingYAxis) {
        const dy = e.clientY - dragStartY;
        const factor = Math.exp(-dy * 0.006);
        verticalScale = Math.max(MIN_VERTICAL_SCALE, Math.min(MAX_VERTICAL_SCALE, dragStartVerticalScale * factor));
        return;
      }

      if (!isDraggingPan) return;
      const dx = e.clientX - dragStartX;
      rightEdgeIndex = dragStartRightEdge - (dx / candleSpacing);
      isLive = false;
      const { plotWidth } = getSafeDimensions();
      clampHorizontalBounds(plotWidth, candles.length);
    });

    window.addEventListener('mouseup', () => {
      isDraggingPan = false;
      isDraggingYAxis = false;
    });

    canvas.addEventListener('dblclick', (e) => {
      if (isOverYAxisColumn(e.clientX)) {
        verticalScale = DEFAULT_VERTICAL_SCALE;
      }
    });

    canvas.addEventListener('mouseleave', () => {
      hoverCrosshair = null;
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      applyHorizontalZoom(candleSpacing * factor, e.clientX);
    }, { passive: false });

    // Touch Controls (Pan, Y-Axis Vertical Drag, Pinch-to-Zoom)
    function getTouchSpread(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        const t = e.touches[0];
        initialPinchDistance = null;

        if (isOverYAxisColumn(t.clientX)) {
          const now = Date.now();
          if (now - lastYAxisTapTime < 320) {
            verticalScale = DEFAULT_VERTICAL_SCALE;
          }
          lastYAxisTapTime = now;

          isDraggingYAxis = true;
          isDraggingPan = false;
          dragStartY = t.clientY;
          dragStartVerticalScale = verticalScale;
          hoverCrosshair = null;
        } else {
          isDraggingYAxis = false;
          isDraggingPan = true;
          isSnappingToLive = false;
          dragStartX = t.clientX;
          dragStartRightEdge = rightEdgeIndex;

          const rect = canvas.getBoundingClientRect();
          hoverCrosshair = { x: t.clientX - rect.left, y: t.clientY - rect.top };
        }
      } else if (e.touches.length === 2) {
        isDraggingPan = false;
        isDraggingYAxis = false;
        hoverCrosshair = null;
        initialPinchDistance = getTouchSpread(e.touches[0], e.touches[1]);
        initialPinchSpacing = candleSpacing;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDraggingYAxis) {
        const dy = e.touches[0].clientY - dragStartY;
        const factor = Math.exp(-dy * 0.006);
        verticalScale = Math.max(MIN_VERTICAL_SCALE, Math.min(MAX_VERTICAL_SCALE, dragStartVerticalScale * factor));
      } else if (e.touches.length === 1 && isDraggingPan) {
        const dx = e.touches[0].clientX - dragStartX;
        rightEdgeIndex = dragStartRightEdge - (dx / candleSpacing);
        isLive = false;
        const { plotWidth } = getSafeDimensions();
        clampHorizontalBounds(plotWidth, candles.length);
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const currentSpread = getTouchSpread(e.touches[0], e.touches[1]);
        const scale = currentSpread / initialPinchDistance;
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        applyHorizontalZoom(initialPinchSpacing * scale, midX);
      }
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isDraggingPan = false;
        isDraggingYAxis = false;
        initialPinchDistance = null;
        hoverCrosshair = null;
      } else if (e.touches.length === 1) {
        initialPinchDistance = null;
        isDraggingYAxis = false;
        isDraggingPan = true;
        dragStartX = e.touches[0].clientX;
        dragStartRightEdge = rightEdgeIndex;
      }
    });

    // Zoom Buttons & Snap-to-Live Button
    document.getElementById('zoomInBtn').addEventListener('click', () => {
      applyHorizontalZoom(candleSpacing * 1.2);
    });

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      applyHorizontalZoom(candleSpacing * 0.83);
    });

    snapLiveBtn.addEventListener('click', () => {
      isSnappingToLive = true;
    });

    // Double-Tap Top-Left Kryon Logo/Name to Reset & Sync Across All Devices
    function resetGlobalSession() {
      const now = Date.now();
      sessionState = {
        epochStart: now,
        sessionSeed: (Math.floor(Math.random() * 0x7fffffff) ^ (now & 0x7fffffff)) >>> 0
      };
      resetCandleCacheIfNeeded();
      snapToLiveCamera();
      persistSessionToCloud(sessionState);
    }

    window.resetToStartingPrice = resetGlobalSession;

    brandResetArea.addEventListener('click', () => {
      const now = Date.now();
      if (now - lastBrandTapTime < 340) {
        resetGlobalSession();
      }
      lastBrandTapTime = now;
    });

    // Immediate 0ms Boot + Background Cloud Sync
    resetCandleCacheIfNeeded();
    snapToLiveCamera();
    requestAnimationFrame(renderLoop);
    initCloudSync();
  </script>
</body>
</html>
